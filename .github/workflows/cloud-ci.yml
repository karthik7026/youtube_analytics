name: Cloud Go CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build analytics binary
        run: |
          mkdir -p dist
          go build -trimpath -o dist/youtube_analytics ./cmd

      - name: Upload cloud build
        uses: actions/upload-artifact@v4
        with:
          name: youtube-analytics-linux
          path: dist/youtube_analytics
          if-no-files-found: error
          retention-days: 7
